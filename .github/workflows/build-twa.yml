name: Build MK Movies v2.10.1 Named Resumable Downloads APK/AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android release
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify project files
        run: |
          echo "Repository root: $PWD"
          test -f settings.gradle || { echo "::error::settings.gradle is missing. Upload the files to the repository root, not inside another folder."; exit 1; }
          test -f build.gradle || { echo "::error::build.gradle is missing. Upload the files to the repository root."; exit 1; }
          test -f app/build.gradle || { echo "::error::app/build.gradle is missing. The app folder was not uploaded correctly."; exit 1; }
          test -f app/src/main/AndroidManifest.xml || { echo "::error::AndroidManifest.xml is missing."; exit 1; }

      - name: Install Gradle 9.6.0
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-9.6.0-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle
          echo "/tmp/gradle/gradle-9.6.0/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Verify API 36 and release version
        run: |
          grep -Eq '^[[:space:]]*compileSdk[[:space:]]+36([[:space:]]|$)' app/build.gradle || { echo "::error::compileSdk must be 36"; exit 1; }
          grep -Eq '^[[:space:]]*targetSdk[[:space:]]+36([[:space:]]|$)' app/build.gradle || { echo "::error::targetSdk must be 36"; exit 1; }
          grep -Eq '^[[:space:]]*versionCode[[:space:]]+22([[:space:]]|$)' app/build.gradle || { echo "::error::versionCode must be 22"; exit 1; }
          grep -Eq "^[[:space:]]*versionName[[:space:]]+'2\\.10\\.1'([[:space:]]|$)" app/build.gradle || { echo "::error::versionName must be 2.10.1"; exit 1; }
          grep -Fq 'android:value="mk_movies_alerts_v3"' app/src/main/AndroidManifest.xml || { echo "::error::Firebase notification channel must be mk_movies_alerts_v3"; exit 1; }
          echo "Verified Android API 36 and MK Movies v2.10.1 (22)."

      - name: Prepare and verify Play upload key
        env:
          KB_KEYSTORE_BASE64: ${{ secrets.KB_KEYSTORE_BASE64 }}
          KB_KEYSTORE_PASSWORD: ${{ secrets.KB_KEYSTORE_PASSWORD }}
          KB_KEY_ALIAS: ${{ secrets.KB_KEY_ALIAS }}
        run: |
          if [ -z "$KB_KEYSTORE_BASE64" ]; then
            echo "::error::Missing repository secret: KB_KEYSTORE_BASE64"
            exit 1
          fi
          if [ -z "$KB_KEYSTORE_PASSWORD" ]; then
            echo "::error::Missing repository secret: KB_KEYSTORE_PASSWORD"
            exit 1
          fi
          if [ -z "$KB_KEY_ALIAS" ]; then
            echo "::error::Missing repository secret: KB_KEY_ALIAS"
            exit 1
          fi
          printf '%s' "$KB_KEYSTORE_BASE64" | base64 --decode > kb-movies-release-key.jks
          EXPECTED_SHA1="59:0D:C2:C2:11:7A:04:5B:8A:03:44:24:2D:A4:C4:32:43:3F:A3:05"
          ACTUAL_SHA1="$(keytool -list -v -keystore kb-movies-release-key.jks -storepass "$KB_KEYSTORE_PASSWORD" -alias "$KB_KEY_ALIAS" 2>/dev/null | sed -n 's/^[[:space:]]*SHA1: //p' | head -n 1 | tr -d '\r')"
          if [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "::error::Wrong Play upload key. Expected SHA1 $EXPECTED_SHA1 but received ${ACTUAL_SHA1:-unreadable key}."
            exit 1
          fi
          echo "Play upload key verified: $ACTUAL_SHA1"

      - name: Build release APK and AAB
        env:
          KB_KEYSTORE_PASSWORD: ${{ secrets.KB_KEYSTORE_PASSWORD }}
          KB_KEY_PASSWORD: ${{ secrets.KB_KEY_PASSWORD }}
          KB_KEY_ALIAS: ${{ secrets.KB_KEY_ALIAS }}
        run: |
          if [ -z "$KB_KEYSTORE_PASSWORD" ]; then
            echo "::error::Missing repository secret: KB_KEYSTORE_PASSWORD"
            exit 1
          fi
          if [ -z "$KB_KEY_PASSWORD" ]; then
            echo "::error::Missing repository secret: KB_KEY_PASSWORD"
            exit 1
          fi
          if [ -z "$KB_KEY_ALIAS" ]; then
            echo "::error::Missing repository secret: KB_KEY_ALIAS"
            exit 1
          fi
          gradle --version
          gradle --no-daemon --stacktrace :app:assembleRelease :app:bundleRelease

      - name: Verify and name release files
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/MK-Movies-v2.10.1-release.apk
          cp app/build/outputs/bundle/release/app-release.aab release/MK-Movies-v2.10.1-play-console.aab
          EXPECTED_SHA1="59:0D:C2:C2:11:7A:04:5B:8A:03:44:24:2D:A4:C4:32:43:3F:A3:05"
          keytool -printcert -jarfile release/MK-Movies-v2.10.1-play-console.aab | grep -F "SHA1: $EXPECTED_SHA1"
          echo "Release AAB signing certificate verified."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mk-movies-release-apk
          path: release/MK-Movies-v2.10.1-release.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: mk-movies-release-aab
          path: release/MK-Movies-v2.10.1-play-console.aab
          if-no-files-found: error
